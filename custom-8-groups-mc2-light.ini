[custom]

; MC2-friendly compact profile: eight groups, small ACL4SSR rulesets only.
; Avoid ChinaDomain/ChinaCompanyIp and full media/ads lists that expand YAML heavily.

; AI rules first so they always use group 5 (no Hong Kong nodes in its whitelist).
ruleset=5 英美日法新,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=5 英美日法新,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=5 英美日法新,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=5 英美日法新,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,deepseek.com
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,perplexity.ai
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,x.ai
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,grok.com
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,poe.com
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,character.ai
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,mistral.ai
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,cohere.com
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,openrouter.ai
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,cursor.com
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,anthropic.com
ruleset=5 英美日法新,[]DOMAIN-SUFFIX,chatgpt.com

; Compact ad coverage; group 8 lets the user choose REJECT or DIRECT.
ruleset=8 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; Common proxy traffic. Broader country/media catalogs are intentionally omitted.
ruleset=1 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=1 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list
ruleset=1 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; Lightweight China fallback, then the user's selectable catch-all group.
ruleset=7 漏网之鱼,[]GEOIP,CN
ruleset=7 漏网之鱼,[]FINAL

; 1 总入口
custom_proxy_group=1 节点选择`select`[]2 自动选择`[]3 手动选择`[]4 香港`[]5 英美日法新`[]6 故障转移`[]DIRECT

; 2 60-second test; lowest delay with 10 ms tolerance
custom_proxy_group=2 自动选择`url-test`.*`http://www.gstatic.com/generate_204`60,,10

; 3 all nodes, manual choice
custom_proxy_group=3 手动选择`select`.*

; 4 Hong Kong nodes only
custom_proxy_group=4 香港`select`(港|香港|HK[0-9 ]|Hong[ ._-]*Kong|HKG)

; 5 whitelisted US/UK/JP/FR/SG names only, excluding HK by positive matching.
; Supports country flags and delimited country codes; avoids loose substring matches.
custom_proxy_group=5 英美日法新`url-test`(🇺🇸|🇬🇧|🇯🇵|🇫🇷|🇸🇬|(^|[^A-Za-z])(US|USA|UK|GB|JP|FR|SG)([^A-Za-z]|$)|美国|美國|英国|英國|日本|法国|法國|新加坡|狮城|United[ ._-]*States|United[ ._-]*Kingdom|Japan|France|Singapore)`http://www.gstatic.com/generate_204`60,,30

; 6 fallback across all nodes
custom_proxy_group=6 故障转移`fallback`.*`http://www.gstatic.com/generate_204`60,,10

; 7 catch-all choice; proxy entry is the initial/default choice
custom_proxy_group=7 漏网之鱼`select`[]1 节点选择`[]2 自动选择`[]3 手动选择`[]4 香港`[]5 英美日法新`[]6 故障转移`[]DIRECT

; 8 ads
custom_proxy_group=8 广告拦截`select`[]REJECT`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
