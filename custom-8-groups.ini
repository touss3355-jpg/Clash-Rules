[custom]

; 八组策略：1 节点选择 / 2 自动选择 / 3 手动选择 / 4 香港
;          5 英美日法新 / 6 故障转移 / 7 漏网之鱼 / 8 广告拦截
; 兼容 SubConverter / ACL4SSR 风格；节点名称匹配不区分大小写由客户端处理。

; 规则顺序：局域网与直连 -> 广告 -> AI -> 常用服务 -> 国内直连 -> 代理兜底 -> FINAL
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

ruleset=8 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=8 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=8 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyList.list
ruleset=8 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list

; AI 规则必须先于通用代理规则，全部固定进入 5 英美日法新
ruleset=5 英美日法新,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=5 英美日法新,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=5 英美日法新,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=5 英美日法新,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list

ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/DisneyPlus.list
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=7 漏网之鱼,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=7 漏网之鱼,[]GEOIP,CN
ruleset=7 漏网之鱼,[]FINAL

; 1 是总入口：可在它下面切换自动、手动、地区、故障转移
custom_proxy_group=1 节点选择`select`[]2 自动选择`[]3 手动选择`[]4 香港`[]5 英美日法新`[]6 故障转移`[]DIRECT

; 2：所有节点，60 秒测速，最低延迟；容差 10 ms
custom_proxy_group=2 自动选择`url-test`.*`http://www.gstatic.com/generate_204`60,,10

; 3：手动选择全部节点
custom_proxy_group=3 手动选择`select`.*

; 4：仅香港名称；避免把 HK 节点混入 AI 地区组
custom_proxy_group=4 香港`select`(港|香港|HK|Hong[ ._-]*Kong|HKG)

; 5：英、美、日、法、新；明确排除香港；60 秒测速，容差 30 ms
custom_proxy_group=5 英美日法新`url-test`(?i)^(?!.*(港|香港|HK|Hong[ ._-]*Kong|HKG))(.*(美|美国|美國|US|USA|United[ ._-]*States|英|英国|英國|UK|GB|United[ ._-]*Kingdom|London|日|日本|JP|Japan|东京|東京|法|法国|法國|FR|France|Paris|新加坡|狮城|SG|Singapore).*)$`http://www.gstatic.com/generate_204`60,,30

; 6：全部节点故障转移，按顺序使用可用节点
custom_proxy_group=6 故障转移`fallback`.*`http://www.gstatic.com/generate_204`60,,10

; 7：最终兜底；保留常用入口与 DIRECT
custom_proxy_group=7 漏网之鱼`select`[]1 节点选择`[]2 自动选择`[]3 手动选择`[]4 香港`[]5 英美日法新`[]6 故障转移`[]DIRECT

; 8：广告规则只提供 REJECT 与 DIRECT
custom_proxy_group=8 广告拦截`select`[]REJECT`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
